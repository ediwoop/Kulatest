name: Android prototype APK
on:
  workflow_dispatch:
  push:
    branches: [android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Godot 4.4.1 and export templates
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Set Android SDK for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Generate debug signing keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run scene smoke test
        run: |
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/kula-smoke.log
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/kula-smoke.log; then exit 1; fi
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/kula-native-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kula-native-debug-apk
          path: android-native/build/kula-native-debug.apk
          if-no-files-found: error
